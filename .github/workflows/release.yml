name: Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify release tag and version
        if: github.event_name != 'pull_request'
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag is not strict SemVer: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"

      - name: Verify tag commit is on main
        if: github.event_name != 'pull_request'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          git merge-base --is-ancestor "$TAG_SHA" origin/main

      - name: Run full test suite
        run: go test ./...

      - name: Run static checks
        run: go vet ./...

      - name: Verify GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check

      - name: Build CLI
        run: go build ./...

      - name: Dry-run npm package
        run: npm pack --dry-run --json

      - name: Build snapshot binary artifacts
        if: matrix.node-version == '22' && github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --snapshot --clean

      - name: Verify six snapshot archives
        if: matrix.node-version == '22' && github.event_name == 'pull_request'
        run: |
          COUNT=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          test "$COUNT" = "6"

      - name: Verify artifact version
        if: github.event_name != 'pull_request'
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p .release-check release-artifacts
          go build -ldflags "-X github.com/uqpay/uqpay-cli/internal/build.Version=$VERSION -X github.com/uqpay/uqpay-cli/internal/build.Date=ci" -o .release-check/uqpay .
          .release-check/uqpay --version | grep -F "$VERSION"
          npm pack --pack-destination release-artifacts --json > release-artifacts/pack.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('release-artifacts/pack.json'))[0]; const v=require('./package.json').version; if(p.version!==v) throw new Error('packed version '+p.version+' != '+v)"

      - uses: actions/upload-artifact@v4
        if: matrix.node-version == '22' && github.event_name != 'pull_request'
        with:
          name: npm-package
          path: release-artifacts/*.tgz
          if-no-files-found: error

  goreleaser:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check whether binary release already exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq 'checksums.txt'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        if: steps.release.outputs.exists == 'false'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}

  publish-npm:
    needs: [verify, goreleaser]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check whether npm version already exists
        id: registry
        run: |
          VERSION="${RELEASE_TAG#v}"
          if npm view "@uqpay/cli@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-artifacts/*.tgz --access public
